<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1A2A"/>
      <stop offset="60%" stop-color="#16263F"/>
      <stop offset="100%" stop-color="#1E3352"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6CB82"/>
      <stop offset="100%" stop-color="#C9A24B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#cGrad)"/>
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="url(#gold)" stroke-width="1" stroke-opacity="0.4"/>
  
  <!-- Stylized Executive Portrait Silhouette -->
  <g transform="translate(150, 160)" stroke="url(#gold)" fill="none">
    <!-- Head & Shoulders -->
    <circle cx="150" cy="120" r="65" stroke-width="1.5" stroke-opacity="0.8" fill="rgba(201, 162, 75, 0.08)"/>
    <path d="M 40 380 C 40 260, 260 260, 260 380 Z" stroke-width="1.5" stroke-opacity="0.8" fill="rgba(20, 35, 55, 0.6)"/>
    <polygon points="150,220 135,280 165,280" stroke-width="1" stroke-opacity="0.6"/>
  </g>

  <g text-anchor="middle" font-family="'Cairo', sans-serif">
    <rect x="220" y="580" width="160" height="28" rx="14" fill="rgba(201, 162, 75, 0.15)" stroke="url(#gold)" stroke-width="0.8"/>
    <text x="300" y="599" font-size="13" fill="#E6CB82">رئيس مجلس الإدارة</text>
    
    <text x="300" y="650" font-size="26" font-weight="700" fill="#F3EEDF">م. محمود عبدالمعطي</text>
    <text x="300" y="685" font-size="16" fill="#A9B4C8" font-family="'Playfair Display', serif">Eng. Mahmoud Abdelmoaty</text>
    
    <line x1="220" y1="710" x2="380" y2="710" stroke="url(#gold)" stroke-width="1" stroke-opacity="0.5"/>
    <text x="300" y="740" font-size="13" fill="#C9A24B">الواحة العقارية للتطوير · منذ 2020</text>
  </g>
</svg>