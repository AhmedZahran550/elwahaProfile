<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1067" width="800" height="1067">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1A2A"/>
      <stop offset="60%" stop-color="#142236"/>
      <stop offset="100%" stop-color="#1A2D47"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6CB82"/>
      <stop offset="50%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#9A7828"/>
    </linearGradient>
    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(201, 162, 75, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="1067" fill="url(#bgGrad)"/>
  <rect width="800" height="1067" fill="url(#archGrid)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="752" height="1019" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.35"/>
  <rect x="32" y="32" width="736" height="1003" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- Corner Accents -->
  <path d="M 24 64 L 64 64 L 64 24" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <path d="M 776 64 L 736 64 L 736 24" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <path d="M 24 1003 L 64 1003 L 64 1043" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <path d="M 776 1003 L 736 1003 L 736 1043" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>

  <!-- Architectural Building Silhouette Illustration -->
  <g transform="translate(100, 180)" stroke="url(#goldGrad)" fill="none">
    
      <!-- Facade Massing -->
      <path d="M 60 480 L 60 100 L 300 40 L 540 100 L 540 480 Z" stroke-width="1.2" stroke-opacity="0.5" fill="rgba(20, 34, 54, 0.4)"/>
      <line x1="300" y1="40" x2="300" y2="480" stroke-width="0.8" stroke-opacity="0.4"/>
      
      <!-- Floors -->
      <line x1="60" y1="180" x2="540" y2="180" stroke-width="0.7" stroke-opacity="0.3"/>
      <line x1="60" y1="260" x2="540" y2="260" stroke-width="0.7" stroke-opacity="0.3"/>
      <line x1="60" y1="340" x2="540" y2="340" stroke-width="0.7" stroke-opacity="0.3"/>
      <line x1="60" y1="420" x2="540" y2="420" stroke-width="0.7" stroke-opacity="0.3"/>
      
      <!-- Windows & Balconies -->
      <rect x="120" y="200" width="80" height="40" stroke-width="1" stroke-opacity="0.6"/>
      <rect x="240" y="200" width="120" height="40" stroke-width="1" stroke-opacity="0.6"/>
      <rect x="400" y="200" width="80" height="40" stroke-width="1" stroke-opacity="0.6"/>

      <rect x="120" y="280" width="80" height="40" stroke-width="1" stroke-opacity="0.6"/>
      <rect x="240" y="280" width="120" height="40" stroke-width="1" stroke-opacity="0.6"/>
      <rect x="400" y="280" width="80" height="40" stroke-width="1" stroke-opacity="0.6"/>

      <rect x="120" y="360" width="80" height="40" stroke-width="1" stroke-opacity="0.6"/>
      <rect x="240" y="360" width="120" height="40" stroke-width="1" stroke-opacity="0.6"/>
      <rect x="400" y="360" width="80" height="40" stroke-width="1" stroke-opacity="0.6"/>

      <!-- Grand Hotel Entrance -->
      <path d="M 240 480 L 240 440 L 360 440 L 360 480 Z" stroke-width="1.5" stroke-opacity="0.9" fill="rgba(201, 162, 75, 0.15)"/>
      <polygon points="300,70 330,120 270,120" stroke-width="1" stroke-opacity="0.7"/>
    
  </g>

  <!-- Golden Radial Glow -->
  <circle cx="400" cy="460" r="180" fill="url(#goldGrad)" opacity="0.04"/>

  <!-- Brand Typography Content -->
  <g text-anchor="middle" font-family="'Cairo', 'Tajawal', sans-serif">
    <!-- Floral Badge -->
    <rect x="330" y="690" width="140" height="28" rx="14" fill="rgba(201, 162, 75, 0.12)" stroke="url(#goldGrad)" stroke-width="0.8"/>
    <text x="400" y="709" font-size="13" fill="#E6CB82" letter-spacing="1">DAMASK ROSE</text>

    <!-- Arabic Title -->
    <text x="400" y="775" font-size="34" font-weight="700" fill="#F3EEDF">عمارة الجوري</text>
    <text x="400" y="815" font-size="18" fill="#A9B4C8" font-family="'Playfair Display', serif" font-style="italic">Al Gouri Residence</text>

    <!-- Divider Line -->
    <line x1="320" y1="845" x2="480" y2="845" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Specifications Details -->
    <text x="400" y="885" font-size="16" fill="#E6CB82">عمارة 90، منطقة 11</text>
    <text x="400" y="915" font-size="14" fill="#A9B4C8">الواجهة المعمارية الرئيسية · Architectural Façade</text>
    <text x="400" y="945" font-size="13" fill="#C9A24B">8 وحدات فاخرة · مساحات 140 - 180 م² · الحي المتميز</text>
  </g>
</svg>